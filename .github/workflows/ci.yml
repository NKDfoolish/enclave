name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf generate
      # Generated code is committed; fail if a .proto changed without regenerating.
      # `git status` also catches new files, which `git diff` would miss.
      - name: Check generated code is up to date
        run: |
          if [ -n "$(git status --porcelain -- gen rag/gen)" ]; then
            git status --porcelain -- gen rag/gen
            echo "Generated code is stale: run 'make proto' and commit the result." >&2
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enclave -d enclave_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      objectstore:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: enclave
          RUSTFS_SECRET_KEY: enclave-ci-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_OBJECTSTORE_ENDPOINT: http://localhost:9000
      TEST_OBJECTSTORE_ACCESS_KEY: enclave
      TEST_OBJECTSTORE_SECRET_KEY: enclave-ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
      - name: Migrate test database
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.26.0 -dir api/migrations postgres "$TEST_DATABASE_URL" up
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  smoke:
    needs: [go, python]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enclave -d enclave"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      objectstore:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: enclave
          RUSTFS_SECRET_KEY: enclave-ci-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      OBJECTSTORE_ENDPOINT: http://localhost:9000
      OBJECTSTORE_ACCESS_KEY: enclave
      OBJECTSTORE_SECRET_KEY: enclave-ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10.2.0
      - run: cd rag && uv sync --locked
      # The API checks its bucket at startup; production buckets come from Terraform.
      - name: Create bucket
        env:
          AWS_ACCESS_KEY_ID: enclave
          AWS_SECRET_ACCESS_KEY: enclave-ci-secret
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url "$OBJECTSTORE_ENDPOINT" s3api create-bucket --bucket enclave-documents
      - run: ./scripts/smoke.sh
